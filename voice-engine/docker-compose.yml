services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    # For NVIDIA GPU on supported Linux hosts, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  stt:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      WHISPER__INFERENCE_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_cache:/root/.cache/huggingface

  tts:
    build:
      context: ./tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      TTS_MODEL_ID: ${TTS_MODEL_ID:-ai4bharat/IndicF5}
      HF_HOME: /models/cache
    volumes:
      - tts_cache:/models/cache

volumes:
  ollama_data:
  whisper_cache:
  tts_cache: